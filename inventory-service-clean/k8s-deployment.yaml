apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: inventory-service:v1
        imagePullPolicy: Never  # 👈 關鍵！強制 K8s 使用本機剛 Build 好的 v1 鏡像，絕不抓快取
        ports:
        - containerPort: 9090
          name: grpc
        - containerPort: 8080
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30090
    name: grpc
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http