apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: notification-service:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8083
        # 強制覆蓋啟動指令，直接將 Kafka 位址透過 JVM 參數傳遞，繞過所有設定檔
        command: ["java"]
        args:
          - "-Dspring.kafka.bootstrap-servers=host.docker.internal:9092"
          - "-jar"
          - "/app/app.jar"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP